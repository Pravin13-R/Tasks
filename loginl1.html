<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body{
            background-color: aqua;
            margin: 10px;
            padding: 10px;
        }
        .log2{
            padding-left: 100px;
            background-color: rgba(255, 255, 255, 0.859);
            width: 450px;
            height: 350px;
            border-radius: 5%;
            align-items: center;
            display: block;
            justify-content: center;
            box-shadow: 5px 5px rgba(172, 171, 171, 0.837);
        }
        .log2 input {
            margin-bottom: 9px;
            padding: 5px;
            border-radius: 5px;
            width: 250px;
            background-color: rgba(236, 233, 233, 0.67);
            margin-left: 45px;
        }
        .log1{
            align-items: center;
            justify-content: center;
            display: flex;
            margin-top: 10%;
        }
        .log3{
            margin-left: 20%;
            width: 150px;
            height: 30px;
            background-color: rgba(52, 31, 244, 0.886);
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }
        .log3:hover{
            background-color: rgba(0, 0, 0, 0.759);
        }
        .log2 h1{
            margin-left: 120px;
        }
        .log2 label{
            margin: 45px;
        }
    </style>
</head>
<body>
    <div class="log1">
        <div class="log2">
            <h1 style="color: rgb(187, 5, 187);">LOGIN</h1>
            <form action="">
                <label for="login">Username :</label><br><br>
                <input type="text" name="" id="" placeholder="Enter the name" required><br>
                <label for="">Email :</label><br><br>
                <input type="email" name="email" id="email" placeholder="ab24@gmail.com" required><br>
                <label for="">Password :</label><br><br>
                <input type="password" name="" id="" placeholder="Least 6 character" min="6" max="10" required><br>
                <button class="log3">Login</button><br>
            </form>
        </div>
    </div>
</body>
</html>
