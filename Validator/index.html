<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALIDATORS</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 97vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }
      h1 {
        padding: 20px;
        text-align: center;
        font-size: 37px;
        color: #fff;
      }
      .b1 {
        margin-top: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* padding: 10px; */
      }
      .buttons {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        display: grid;
        grid-template-columns: auto auto;
        gap: 80px;
        border-radius: 5px;
        padding: 50px;
      }
      button {
        background: #2563eb;
        width: 350px;
        padding: 20px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 5px;
        border: none;
        background-color: tomato;
        color: white;
        cursor: pointer;
        box-shadow: 2px rgb(170, 170, 170);
      }
      button:hover {
        transform: translateY(-5px);
        transition: 0.3s ease;
        background: #1d4ed8;
      }

    </style>
  </head>
  <body>
    <h1>VALIDATORS</h1>
    <div class="b1">
      <div class="buttons">
        <a href="primenumber.html"><button>Prime Number</button></a>
        <a href="positive.html"><button>Positive / Negative</button></a>
        <a href="oddeven.html"><button>Odd / Even</button></a>
        <a href="amstrong.html"><button>Armstrong Number</button></a>
        <a href="Factorial.html"> <button>Factorial</button></a>
        <a href="sumofdigits.html"><button>Sum Of Digits</button></a>
      </div>
    </div>
  </body>
</html>
