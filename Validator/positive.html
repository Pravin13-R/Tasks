<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positive Or Negative</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="icon.png" />
  </head>
  <body>
    <h1>Positive Or Negative</h1>
    <div class="a1">
      <div class="form">
        <form action="" name="positiveForm">
          <input
            type="text"
            name="num"
            id="num"
            placeholder="Enter the Number"
          /><br />
          <button type="button" onclick="validate()">Check</button>
          <h3 id="positive"></h3>
        </form>
      </div>
    </div>
    <div class="c11">
      <a href="index.html"><button class="c1">Back</button></a>
    </div>
  </body>
  <script>
    function validate() {
      let b = parseInt(document.positiveForm.num.value);

      if (isNaN(b)) {
        alert("Enter the valid number");
        return;
      }

      if (b > 0) {
        document.getElementById("positive").innerHTML =
          b + " is a Positive number";

      } 
      
      else if (b < 0) {
        document.getElementById("positive").innerHTML =
          b + " is a Negative number";

      } 
      
      else {
        document.getElementById("positive").innerHTML =
          "Zero is a Neutral number";
      }
    }
  </script>
</html>
